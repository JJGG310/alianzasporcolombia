# El sitio vive en web/, pero el build corre desde la raíz del repo: web/scripts/
# sync-datos.mjs necesita leer ../datos/ y ../extracted-data/, que están afuera.
[build]
  base = "web"
  command = "npm run build"
  publish = "web/dist"

# Los datos son la API pública del proyecto: que cualquiera los pueda consumir.
[[headers]]
  for = "/datos/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/extracted-data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# 5 minutos de caché a propósito: en una emergencia el dato viejo hace daño.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los assets llevan hash en el nombre, así que pueden cachearse para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
